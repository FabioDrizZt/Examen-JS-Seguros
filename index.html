<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seguros del Hogar - Examen de JavaScript</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="main-header">
      <div class="header-container">
        <h1>🏡 Seguros del Hogar</h1>
        <p class="subtitle">Cotizador inteligente de pólizas y coberturas para propiedades</p>
      </div>
    </header>

    <main class="main-container">
      <section class="card div-cotizador">
        <h2>Completá los datos de la propiedad</h2>
        <form id="formSeguros">
          <div class="form-group">
            <label for="propiedad">Seleccioná el tipo de propiedad:</label>
            <select id="propiedad" required>
              <option value="" selected disabled>Cargando propiedades...</option>
            </select>
          </div>

          <div class="form-group">
            <label for="ubicacion">Seleccioná la ubicación:</label>
            <select id="ubicacion" required>
              <option value="" selected disabled>Cargando ubicaciones...</option>
            </select>
          </div>

          <div class="form-group">
            <label for="metros2">Superficie en metros cuadrados (m²):</label>
            <input type="number" id="metros2" value="60" min="20" max="1000" step="1" required />
          </div>

          <div class="precio-container">
            <p class="precio-label">
              Precio estimado de póliza mensual:
              <span class="precio-total">$ <span id="valorPoliza">0.00</span></span>
            </p>
          </div>

          <button type="submit" id="btnCotizar" class="btn btn-primary">
            Cotizar y Guardar Póliza
          </button>
        </form>
      </section>

      <section class="card historial-section">
        <div class="historial-header">
          <h2>📋 Historial de Pólizas Cotizadas</h2>
          <button type="button" id="btnLimpiarHistorial" class="btn btn-outline">
            Limpiar Historial
          </button>
        </div>
        <ul id="historialLista" class="historial-lista">
          <!-- Historial dinámico -->
        </ul>
      </section>
    </main>

    <footer class="main-footer">
      <p>Programación II - Examen Práctico de Frontend con JavaScript</p>
    </footer>

    <script type="module" src="js/script.js"></script>
  </body>
</html>
